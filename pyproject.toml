[project]
name = "miadbviz"
version = "0.1.0"
description = "Visualization utilities for the MIADB"
readme = "README.rst"
requires-python = "==3.13.*"
license = { text = "LICENSE" }
authors = [
  { name = "Sarah Szwarc", email = "sarah.szwarc@universite-paris-saclay.fr" },
]
keywords = [
  "knowledgeExtraction",
  "queryingSystem",
  "spectralInformation",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Framework :: Pytest",
  "Framework :: Sphinx",
  "Framework :: tox",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "click>=8.4.2",
  "gensim>=4.4.0",
  "matchms>=0.33.1",
  "matplotlib>=3.11.1",
  "ms2deepscore>=2.9.0",
  "numpy>=2.4.6",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "rdkit>=2025.9.3",
  "scipy>=1.16.3",
  "seaborn>=0.13.2",
  "spec2vec>=0.9.1",
]

[project.urls]
documentation = "https://github.com/spectra-to-knowledge/miadb-visualization"
homepage = "https://github.com/spectra-to-knowledge/miadb-visualization"
repository = "https://github.com/spectra-to-knowledge/miadb-visualization"

[project.scripts]
mia-visualization = "mia-visualization.cli:main"

[dependency-groups]
dev = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
  "prek>=0.4.10",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["miadbviz"]

[tool.deptry]
[tool.deptry.per_rule_ignores]
DEP002 = [
  "openpyxl",
]

[tool.ruff]
fix = true

[tool.ruff.format]
preview = true

[tool.ty.rules]
unresolved-import = "ignore"
